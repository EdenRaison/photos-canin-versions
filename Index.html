<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photos Canin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Même charte que l'Agenda Canin */
:root {
  --bg: #F1F4EE; --surface: #FFFFFF; --ink: #1B2520; --muted: #5C6A61; --line: #D9E0D5;
  --accent: #2C6A4A; --accent-ink: #FFFFFF; --soft: #E1ECE3;
  --amber: #A86A12; --amber-soft: #F7EAD2; --red: #AE3F33; --red-soft: #F6E0DC;
  --shadow: 0 1px 2px rgba(27,37,32,.06), 0 4px 16px rgba(27,37,32,.06);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121814; --surface: #1B231E; --ink: #E6EDE8; --muted: #9AA99F; --line: #2B3730;
    --accent: #72C195; --accent-ink: #0D1A12; --soft: #1F3328;
    --amber: #E3A94F; --amber-soft: #382B16; --red: #EC8175; --red-soft: #3A2220;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121814; --surface: #1B231E; --ink: #E6EDE8; --muted: #9AA99F; --line: #2B3730;
  --accent: #72C195; --accent-ink: #0D1A12; --soft: #1F3328;
  --amber: #E3A94F; --amber-soft: #382B16; --red: #EC8175; --red-soft: #3A2220;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
svg.i { width: 1.2em; height: 1.2em; fill: currentColor; flex: none; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; }
.demo { background: var(--amber-soft); color: var(--amber); font-size: 14px; text-align: center; padding: 6px 16px; font-weight: 700; }
a { color: var(--accent); font-weight: 700; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(2, 1fr); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
nav.tabs button {
  background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 12px; color: var(--muted); font-size: 14px; font-weight: 700; position: relative;
}
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--soft); }
@media (min-width: 820px) {
  body { padding-bottom: 110px; }
  nav.tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line);
    grid-template-columns: repeat(2, auto); justify-content: center; gap: 12px; padding: 8px; }
  nav.tabs button { flex-direction: row; gap: 8px; padding: 8px 18px; font-size: 16px; }
  nav.tabs button svg { width: 22px; height: 22px; }
}
header.top { padding-block: 20px 14px; }
header.top h1 { font-size: 30px; font-weight: 800; }
.sub { color: var(--muted); font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 12px; padding: 10px 16px; font-weight: 700; min-height: 46px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.big { width: 100%; font-size: 19px; min-height: 60px; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 15px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: 15px; font-weight: 700; min-height: 38px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 14px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-weight: 700; color: var(--muted); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--soft); color: var(--accent); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.red { background: var(--red-soft); color: var(--red); }
.note { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.note.amber { background: var(--amber-soft); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.mt { margin-top: 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 700; }
.stat.good { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stat.good span { color: inherit; opacity: .85; }

.sess-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 10px; }
.sess-head h2 { font-size: 21px; }
.accord { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; margin-bottom: 10px; }
.accord .seg { margin: 0; padding: 3px; }
.accord .seg button { padding: 4px 10px; font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; align-items: start; }
.ph .vue { width: 100%; height: 100%; background-repeat: no-repeat; background-color: var(--soft); }
.ph { position: relative; border-radius: 10px; overflow: hidden; aspect-ratio: 4/3; background: var(--soft); }
.ph > button.open { border: 0; padding: 0; display: block; width: 100%; height: 100%; background: none; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph.off img, .ph.off .vue { opacity: .38; filter: grayscale(.7); }
.ph .badge { position: absolute; left: 5px; top: 5px; max-width: calc(100% - 44px); font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: rgba(0,0,0,.66); color: #fff; pointer-events: none; }
.ph .badge.bad { background: #AE3F33; }
.ph .badge.qui { background: #A86A12; }
.ph .t, .ph .dogname { position: absolute; bottom: 4px; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }
.ph .t { left: 5px; } .ph .dogname { right: 5px; }
.keep { position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35);
  display: grid; place-items: center; color: #fff; padding: 0; }
.keep[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.keep svg { width: 18px; height: 18px; fill: currentColor; }
.keep[aria-pressed="false"] svg { visibility: hidden; }

.validate { position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 19; padding: 8px 16px; }
.validate .btn { max-width: 828px; margin: 0 auto; display: flex; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
@media (min-width: 820px) { .validate { bottom: 16px; } }

.overlay { position: fixed; inset: 0; background: rgba(12,18,14,.6); z-index: 50; display: grid; place-items: center; padding: 16px; }
.overlay .card { width: min(440px, 100%); }
.bar { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; margin-top: 12px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--soft); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

dialog { border: 0; border-radius: 18px; padding: 0; width: min(760px, calc(100% - 20px)); max-height: calc(100% - 20px); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(12,18,14,.6); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.dlg-body { padding: 16px; }
.icon-btn { border: 0; background: var(--soft); border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; flex: none; color: var(--ink); }
.icon-btn:disabled { opacity: .35; }
.big-ph { position: relative; border-radius: 12px; overflow: hidden; background: var(--soft); }
.big-ph img { display: block; width: 100%; height: auto; }
.big-ph .cadre { position: absolute; border: 3px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; }
.formats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-items: end; margin-top: 12px; }
.fmt { text-align: center; font-size: 13px; border: 0; background: none; padding: 0; color: var(--ink); }
.crop { background-repeat: no-repeat; background-color: var(--soft); border-radius: 8px; margin: 0 auto 4px; }
.fmt[aria-pressed="true"] .crop { outline: 3px solid var(--accent); outline-offset: 2px; }
.fmt b { display: block; font-size: 13px; }
@media (max-width: 520px) { .formats { grid-template-columns: repeat(2, 1fr); } }
.lbl { font-size: 14px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
select, input[type=search], input[type=text], input[type=datetime-local], textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; color: var(--ink); }
textarea { min-height: 130px; resize: vertical; line-height: 1.4; }

.search { position: relative; margin-bottom: 4px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); fill: var(--muted); width: 22px; height: 22px; }
.search input { padding-left: 42px; font-size: 18px; }
.filter-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 12px 0 6px; }

.post-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; margin: 10px 0; }
.post-strip .crop { flex: none; height: 170px; margin: 0; position: relative; }
.post-strip .crop .x { position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-weight: 700; }
.files { display: grid; gap: 6px; margin-top: 10px; }
.files a { display: flex; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; font-size: 15px; width: max-content; max-width: calc(100% - 32px);
  box-shadow: 0 6px 24px rgba(0,0,0,.25); }
@media (min-width: 820px) { .toast { bottom: 90px; } }
details.how summary { font-weight: 700; cursor: pointer; font-family: var(--f-display); font-size: 18px; }
details.how ol { padding-left: 22px; margin: 10px 0 0; }
details.how li { margin-bottom: 6px; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); }
.loading { padding: 50px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div id="demo" class="demo" hidden>Mode essai : l'agenda est inventé et rien n'est enregistré en ligne</div>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"><div class="loading">Chargement…</div></main>
<div id="validate"></div>
<dialog id="dlg"></dialog>
<div id="overlay"></div>
<div id="toast"></div>
<input type="file" id="fichiers" accept="image/*" multiple hidden>

<script>

/* Si quelque chose bloque au démarrage, on affiche l'erreur au lieu de rester sur « Chargement… » */
(function () {
  function montrer(msg) {
    var m = document.getElementById('main');
    if (m && /Chargement/.test(m.textContent)) m.innerHTML = '<div class="card" style="margin-top:20px"><h2 style="font-size:20px">L\'appli n\'a pas pu démarrer</h2><p class="small muted" style="margin-top:8px">Fais une capture de cet écran et envoie-la à Eden :</p><p class="small" style="margin-top:8px;word-break:break-word"><code>' + String(msg).replace(/</g, '&lt;') + '</code></p><p class="small muted" style="margin-top:8px">' + navigator.userAgent.replace(/</g, '&lt;') + '</p></div>';
  }
  window.addEventListener('error', function (e) {montrer((e.message || 'erreur') + (e.lineno ? ' (ligne ' + e.lineno + ')' : ''));});
  window.addEventListener('unhandledrejection', function (e) {montrer(e.reason && e.reason.message || e.reason);});
  setTimeout(function () {montrer('Rien ne s\'est affiché après 20 secondes.');}, 20000);
})();
</script>
<script>

// Tout le code est enfermé dans une fonction : ses noms ne peuvent pas entrer en conflit avec le code que Google ajoute dans la page
(function () {
  /* ============ Réglages ============ */
  const ACTIONS = {
    saut: ['Saut de haie', 'agility'], tunnel: ['Tunnel', 'agility'], slalom: ['Slalom', 'agility'], passerelle: ['Passerelle', 'agility'],
    palissade: ['Palissade', 'agility'], balancoire: ['Balançoire', 'agility'], pneu: ['Pneu', 'agility'], table: ['Table', 'agility'],
    assis: ['Assis', 'education'], couche: ['Couché', 'education'], pasbouger: ['Pas bouger', 'education'], laisse: ['Marche en laisse', 'education'],
    rappel: ['Rappel', 'education'], jeu: ['Jeu', 'education'], portrait: ['Portrait', 'autre']
  };
  const TAILLE_DRIVE = 2560; // côté le plus long des photos rangées dans Drive
  const MARGE_SEANCE = 20; // minutes avant/après une séance où une photo lui est encore rattachée
  const LIBS = [
  'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
  'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'];

  const MOBILENET = 'https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.50_224/model.json';

  /* ============ Icônes ============ */
  const IC = {
    photos: 'M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4 2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z',
    search: 'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
    cal: 'M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z',
    check: 'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
    close: 'M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
    upload: 'M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z',
    left: 'M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z',
    right: 'M8.6 5.4 10 4l8 8-8 8-1.4-1.4 6.6-6.6z'
  };
  const icon = (n) => "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"" + IC[n] + "\"/></svg>";

  /* ============ Accès au serveur (Google) ou mode essai ============ */
  const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  function call(fn, ...args) {
    if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
    return new Promise((res, rej) => setTimeout(() => {try {res(Demo[fn](...args));} catch (e) {rej(e);}}, 120));
  }

  /* Mode essai (fichier ouvert hors Google) : un agenda inventé, calé sur l'heure des photos choisies */
  const Demo = (() => {
    const chiens = [
    { id: 'd1', nom: 'Rio', race: 'Berger australien', clientId: 'c1', clientNom: 'Mme Martin' },
    { id: 'd2', nom: 'Nala', race: 'Golden retriever', clientId: 'c2', clientNom: 'M. Lambert' },
    { id: 'd3', nom: 'Pepsi', race: 'Border collie', clientId: 'c3', clientNom: 'Mme Roux' },
    { id: 'd4', nom: 'Olly', race: 'Jack russell', clientId: 'c4', clientNom: 'M. Petit' }];

    const db = { Photos: [], Accords: {}, Apprentissage: [], images: {} };
    const PLAN = [
    { type: 'individuel', titre: 'Agility', chiens: ['d1'] },
    { type: 'individuel', titre: '', chiens: ['d2'] },
    { type: 'collectif', titre: 'Agility', chiens: ['d3', 'd4'] }];

    return {
      infoVersion() {return { actuelle: 'essai', derniere: null };},
      mettreAJour() {throw new Error('La mise à jour se fait dans l’appli installée sur Google.');},
      getContexte(dates, heures) {
        // Regroupe les heures des photos en créneaux d'une heure : chaque créneau devient une séance inventée
        const seances = [];
        (heures || []).slice().sort().forEach((h) => {
          const last = seances[seances.length - 1];
          const t = new Date(h).getTime();
          if (last && last.date === h.slice(0, 10) && t - last.t0 < 75 * 60000) return;
          const k = seances.length % PLAN.length,d = new Date(t - 5 * 60000);
          seances.push(Object.assign({ id: 'demo' + seances.length, t0: t, date: h.slice(0, 10), duree: 60,
            debut: h.slice(0, 10) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes() < 30 ? 0 : 30) }, PLAN[k]));
        });
        if (!seances.length) (dates || []).forEach((d) => PLAN.forEach((p, k) => seances.push(Object.assign({ id: 'demo-' + d + k, debut: d + 'T' + ['09:00', '10:30', '14:00'][k], duree: 60 }, p))));
        return { seances, chiens: chiens.slice(), clients: [], source: 'demo', accords: Object.assign({}, db.Accords), appris: db.Apprentissage.slice() };
      },
      enregistrerPhoto(meta, b64, mini) {
        const fileId = 'f' + db.Photos.length;
        db.images[fileId] = b64;
        db.Photos.push(Object.assign({}, meta, { fileId, miniature: mini, ajoutee: toStr(new Date()) }));
        return { id: meta.id, fileId, dossier: '#' };
      },
      apprendre(items) {items.forEach((i) => db.Apprentissage.push(i));},
      setAccord(clientId, nom, accord) {db.Accords[clientId] = accord;return true;},
      ajouterChien(nom) {const d = { id: 'x' + Date.now(), nom, race: '', clientId: '', clientNom: '' };chiens.push(d);return d;},
      chercher(f) {
        const q = norm(f.q || '');
        const facettes = { chiens: {}, clients: {}, mois: {}, actions: {} };
        db.Photos.forEach((r) => {if (r.chienId) facettes.chiens[r.chienId] = r.chienNom;if (r.clientId) facettes.clients[r.clientId] = r.clientNom;facettes.mois[r.date.slice(0, 7)] = 1;if (r.action) facettes.actions[r.action] = 1;});
        const res = db.Photos.filter((r) => (!f.chienId || r.chienId === f.chienId) && (!f.clientId || r.clientId === f.clientId) && (!f.mois || r.date.slice(0, 7) === f.mois) && (
        !f.action || r.action === f.action) && (!q || q.split(/\s+/).every((m) => norm([r.chienNom, r.clientNom, r.seanceNom, r.action, r.date, r.note].join(' ')).includes(m)))).
        sort((a, b) => (b.date + b.heure).localeCompare(a.date + a.heure));
        return { total: res.length, photos: res.slice(0, 150), facettes };
      },
      getImage(fileId) {return db.images[fileId];},
      majPhoto(id, champs) {const r = db.Photos.find((x) => x.id === id);Object.assign(r, champs);return r;}

      if (!ok) erreurs++;
    }
    progression('Presque fini…', 0, 0, 'L\'appli retient les chiens et les actions pour la prochaine fois.');
    const envoyees = kept.filter((p) => p.envoyee);
    const items = [];
    envoyees.forEach((p) => {
      if (p.chienId && p.vDog) items.push({ id: uid('a'), type: 'chien', label: p.chienId, vecteur: encoder(p.vDog) });
      if (p.action && p.vImg) items.push({ id: uid('a'), type: 'action', label: p.action, vecteur: encoder(p.vImg) });
    });
    try {if (items.length) await call('apprendre', items);} catch (e) {console.warn(e);}
    el('#overlay').innerHTML = '';
    B.photos.forEach((p) => URL.revokeObjectURL(p.thumb));
    st.fini = { n: envoyees.length, erreurs, dossier };
    st.batch = null;st.resultats = null;
    render();scrollTo(0, 0);
  }

  /* ============ Écran « Rechercher » ============ */
  let rechTimer;
  async function chercher() {
    try {st.resultats = await call('chercher', st.recherche);} catch (e) {erreur(e);st.resultats = { total: 0, photos: [], facettes: { chiens: {}, clients: {}, mois: {}, actions: {} } };}
    if (st.tab === 'chercher') {const q = el('#q'),pos = q && document.activeElement === q ? q.selectionStart : null;render();if (pos !== null) {const n = el('#q');n.focus();n.setSelectionRange(pos, pos);}}
  }
  function renderChercher() {
    const R = st.resultats,f = st.recherche;
    let h = "<header class=\"top\"><h1>Rechercher</h1><p class=\"sub\">Par chien, client, date ou action</p></header>\n    <div class=\"search\">" +
    icon('search') + "<input type=\"search\" id=\"q\" placeholder=\"Rio, tunnel, Martin, 2026-09\u2026\" value=\"" + esc(f.q) + "\" aria-label=\"Rechercher\"></div>";
    if (!R) return h + '<div class="loading"><span class="spin"></span></div>';
    const F = R.facettes;
    const chip = (k, v, l) => "<button class=\"chip\" data-f=\"" + k + "\" data-v=\"" + esc(v) + "\" aria-pressed=\"" + (f[k] === v) + "\">" + esc(l) + "</button>";
    const bloc = (titre, k, obj, lab) => Object.keys(obj).length ? "<div class=\"filter-label\">" + titre + "</div><div class=\"chips\">" + Object.keys(obj).sort((a, b) => k === 'mois' ? b.localeCompare(a) : lab(a).localeCompare(lab(b))).map((v) => chip(k, v, lab(v))).join('') + "</div>" : '';
    h += bloc('Chiens', 'chienId', F.chiens, (v) => F.chiens[v]) + bloc('Clients', 'clientId', F.clients, (v) => F.clients[v]) +
    bloc('Mois', 'mois', F.mois, (v) => cap(fMois.format(parse(v + '-01')))) + bloc('Actions', 'action', F.actions, (v) => v);
    h += "<p class=\"muted small\" style=\"margin:14px 0 8px\">" + R.total + " photo" + (R.total > 1 ? 's' : '') + (R.total > R.photos.length ? " (les " + R.photos.length + " plus r\xE9centes affich\xE9es)" : '') + "</p>";
    if (!R.photos.length) return h + ("<div class=\"empty\">" + (Object.keys(F.chiens).length ? 'Aucune photo ne correspond.' : 'Pas encore de photos rangées. Commence par l\'onglet Trier.') + "</div>");
    return h + ("<div class=\"grid\">" + R.photos.map((r) => "<div class=\"ph\"><button class=\"open\" data-stock=\"" + r.id + "\" aria-label=\"Photo de " + esc(r.chienNom) + " du " + r.date + "\"><img src=\"data:image/jpeg;base64," + r.miniature + "\" alt=\"\" loading=\"lazy\"></button>\n    <span class=\"t\">" +
    fCourt.format(parse(r.date)) + "</span><span class=\"dogname\">" + esc(r.chienNom) + "</span></div>").join('') + "</div>");
  }

  /* ============ Fiche d'une photo rangée ============ */
  async function ouvrirStock(r) {
    dlg.stock = { r, url: 'data:image/jpeg;base64,' + r.miniature, grand: false };
    dessinerStock();
    if (!el('#dlg').open) el('#dlg').showModal();
    if (r.fileId) {
      try {const b64 = await call('getImage', r.fileId);if (dlg.stock && dlg.stock.r === r) {dlg.stock.url = 'data:image/jpeg;base64,' + b64;dlg.stock.grand = true;dessinerStock();}} catch (e) {}
    }
  }
  function dessinerStock() {
    const { r, url } = dlg.stock;
    el('#dlg').innerHTML = "<div class=\"dlg-head\"><div style=\"min-width:0\"><h2 style=\"font-size:18px\">" + esc(r.chienNom || 'Photo') + (r.action ? ' · ' + esc(r.action) : '') + "</h2>\n    <p class=\"sub\">" +
    cap(jour(r.date)) + " \xE0 " + r.heure + (r.clientNom ? ' · ' + esc(r.clientNom) : '') + "</p></div>\n    <button class=\"icon-btn\" data-close aria-label=\"Fermer\">" +
    icon('close') + "</button></div>\n    <div class=\"dlg-body\">\n      <div class=\"big-ph\"><img src=\"" +

    url + "\" alt=\"\"></div>\n      <div class=\"lbl\">Action</div>\n      <div class=\"chips\">" +

    Object.values(ACTIONS).map((a) => "<button class=\"chip\" data-saction=\"" + esc(a[0]) + "\" aria-pressed=\"" + (r.action === a[0]) + "\">" + a[0] + "</button>").join('') + "</div>\n      <div class=\"btn-row mt\">\n        <button class=\"btn primary\" data-telecharger>Enregistrer sur le t\xE9l\xE9phone</button>\n        " + (


    r.fileId && IS_GAS ? "<a class=\"btn\" href=\"https://drive.google.com/file/d/" + r.fileId + "/view\" target=\"_blank\" rel=\"noopener\">Ouvrir dans Drive</a>" : '') + "</div>\n    </div>";

  }
  async function clicStock(e) {
    const { r } = dlg.stock;
    const a = e.target.closest('[data-saction]');
    if (a) {
      try {const n = await call('majPhoto', r.id, { action: r.action === a.dataset.saction ? '' : a.dataset.saction });Object.assign(r, n);dessinerStock();toast('Enregistré');} catch (x) {erreur(x);}
      return;
    }
    if (e.target.closest('[data-telecharger]')) {
      try {
        const img = await b64Image(dlg.stock.grand ? dlg.stock.url.split(',')[1] : await call('getImage', r.fileId));
        await partagerOuTelecharger([{ nom: r.date + " " + r.heure.replace(':', 'h') + " " + (r.chienNom || 'photo') + ".jpg", canvas: reduire(img, 99999) }]);
      } catch (x) {erreur(x);}
    }
  }
  function peutPartager() {try {return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.jpg', { type: 'image/jpeg' })] }));} catch (e) {return false;}}
  async function partagerOuTelecharger(items) {
    const files = await Promise.all(items.map((it) => new Promise((r) => it.canvas.toBlob((b) => r(new File([b], it.nom, { type: 'image/jpeg' })), 'image/jpeg', 0.92))));
    if (peutPartager()) {try {await navigator.share({ files });return;} catch (e) {if (e.name === 'AbortError') return;}}
    files.forEach((f) => {const a = document.createElement('a');a.href = URL.createObjectURL(f);a.download = f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(() => URL.revokeObjectURL(a.href), 5000);});
  }

  /* ============ Événements ============ */
  el('#main').addEventListener('click', async (e) => {
    const t = e.target;
    const act = t.closest('[data-act]') && t.closest('[data-act]').dataset.act;
    if (act === 'importer') return ouvrirImport();
    if (act === 'maj') return majAppli(t.closest('[data-act]'));
    if (act === 'nouveau') {st.fini = null;render();return ouvrirImport();}
    if (act === 'abandon') {if (confirm('Abandonner ce tri ? Rien n\'a encore été rangé, les photos restent dans le téléphone.')) {st.batch.photos.forEach((p) => URL.revokeObjectURL(p.thumb));st.batch = null;render();}return;}
    const k = t.closest('[data-keep]');if (k) {const p = st.batch.photos.find((x) => x.id === k.dataset.keep);p.keep = !p.keep;p.keepManuel = true;return render();}
    const o = t.closest('[data-open]');if (o) return ouvrirPhoto(o.dataset.open);
    const fl = t.closest('[data-filtre]');if (fl) {st.filtre = fl.dataset.filtre;return render();}
    const gr = t.closest('[data-grecadrage]');
    if (gr) {groupesBatch().find((g) => g.cle === gr.dataset.grecadrage).ps.forEach((p) => {p.recadrage = gr.dataset.v;p.recadrageManuel = true;});return render();}
    const tg = t.closest('[data-toutgarder]');
    if (tg) {groupesBatch().find((g) => g.cle === tg.dataset.toutgarder).ps.forEach((p) => {p.keep = true;p.keepManuel = true;});return render();}
    const fc = t.closest('[data-f]');if (fc) {const kk = fc.dataset.f;st.recherche[kk] = st.recherche[kk] === fc.dataset.v ? '' : fc.dataset.v;return chercher();}
    const sk = t.closest('[data-stock]');if (sk) return ouvrirStock(st.resultats.photos.find((r) => r.id === sk.dataset.stock));
  });
  el('#main').addEventListener('input', (e) => {
    if (e.target.id === 'q') {st.recherche.q = e.target.value;clearTimeout(rechTimer);rechTimer = setTimeout(chercher, 350);}
  });
  el('#main').addEventListener('change', async (e) => {
    if (!e.target.matches('[data-hors]')) return;
    const v = e.target.value,d = e.target.dataset.hors;
    const ps = st.batch.photos.filter((p) => !p.seanceId && p.date === d);
    if (v === 'nouveau') {
      const id = await nouveauChien();if (!id) return render();
      ps.forEach((p) => {p.chienId = id;p.chienManuel = true;});
    } else if (v.startsWith('s:')) {
      const s = seance(v.slice(2));
      ps.forEach((p) => {p.seanceId = s.id;p.seanceManuel = true;});
    } else if (v.startsWith('d:')) {
      ps.forEach((p) => {p.chienId = v.slice(2);p.chienManuel = true;});
    }
    classer();render();
  });
  el('#validate').addEventListener('click', (e) => {if (e.target.closest('[data-act="valider"]')) valider().catch((x) => {el('#overlay').innerHTML = '';erreur(x);});});
  window.addEventListener('beforeunload', (e) => {if (st.batch && st.batch.photos.some((p) => p.keep && !p.envoyee)) {e.preventDefault();e.returnValue = '';}});

  /* ============ Mise à jour de l'appli ============ */
  function majDispo() {
    const v = st.version;
    return !!(v && v.derniere && v.derniere.version && v.actuelle !== 'essai' && v.derniere.version > v.actuelle);
  }
  async function verifierVersion() {
    try {st.version = await call('infoVersion');if (!st.batch && !el('#overlay').innerHTML) render();} catch (e) {console.warn(e);}
  }
  async function majAppli(btn) {
    if (!majDispo()) {
      btn.disabled = true;btn.textContent = 'Recherche…';
      await verifierVersion();
      if (!majDispo()) toast('L’appli est déjà à jour.');
      return render();
    }
    progression('Mise à jour de l’appli…', 0, 0, 'Environ 30 secondes. Ne ferme pas la page.');
    try {
      const r = await call('mettreAJour');
      el('#overlay').innerHTML = "<div class=\"overlay\"><div class=\"card\"><h2 style=\"font-size:20px;margin-bottom:6px\">C\u2019est \xE0 jour \u2713</h2>\n      <p class=\"muted small\">La version " +
      esc(r.version) + " est install\xE9e. Recharge l\u2019appli pour l\u2019utiliser.</p>\n      <a class=\"btn primary big mt\" href=\"" +
      esc(r.url) + "\" target=\"_top\">Recharger l\u2019appli</a></div></div>";
    } catch (e) {
      el('#overlay').innerHTML = "<div class=\"overlay\"><div class=\"card\"><h2 style=\"font-size:20px;margin-bottom:6px\">Mise \xE0 jour impossible</h2>\n      <p class=\"muted small\">" +
      esc(e && e.message ? e.message : e) + "</p><button class=\"btn mt\" onclick=\"this.closest('.overlay').remove()\">Fermer</button></div></div>";
    }
  }

  /* ============ Démarrage ============ */
  (async function demarrer() {
    if (!IS_GAS) el('#demo').hidden = false;
    render();
    try {st.jour = await call('getContexte', [toStr(new Date()).slice(0, 10)], []);if (!st.batch) render();} catch (e) {console.warn(e);}
    verifierVersion();
    // Les outils de reconnaissance se chargent en avance, pendant qu'elle choisit ses photos
    setTimeout(() => chargerOutils(), 1500);
  })();

  // Accès pour les tests
  window.PhotosCanin = { st, M, importer, classer, render, valider, chercher, ouvrirStock, ouvrirPhoto, cadreDe };
})();
</script>
</body>
